[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heart_sync"
version = "1.3.1"
authors = [
    {name ="Victor Chung", email= "email@hisemail.com"},
    {name ="Julie Grèzes", email= "email@hisemail.com"},
    {name="Julien Karadayi", email="email@hisemail.com"},
    {name ="Ondine Simonot-Bérenger", email= "email@hisemail.com"},
    {name ="Camille Straboni", email= "email@hisemail.com"},
]
description = "Pythonode to stream ECG data from multiple polar h10 belts"
readme = "README.md"
requires-python = ">=3.6"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
]
dependencies = [
    "bleak",
    "asyncio",
    "bleakheart",
    "ipdb"
]

[project.urls]
"Homepage" = "https://www.gitlab.com/jkaradayi/collectiveecg"
"Bug Tracker" = "https://www.gitlab.com/jkaradayi/collectiveecg/-/issues"
